name: soundwave
description: "SoundWave by Cylone — local music player."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  intl: ^0.20.2
  file_picker: ^10.3.2
  google_fonts: ^6.3.2
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.2
  audio_service: ^0.18.18
  permission_handler: ^12.0.1
  audio_metadata_reader: ^1.4.2
  palette_generator: ^0.3.3+7
  collection: ^1.19.1
  path: ^1.9.1
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
