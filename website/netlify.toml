[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Frame-Options = "DENY"

[[redirects]]
  from = "/privacy"
  to = "/datenschutz.html"
  status = 301

[[redirects]]
  from = "/privacy.html"
  to = "/datenschutz.html"
  status = 301
